<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framing Analysis Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
html { font-size: 125%; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #e2e8f0;
  min-height: 100vh;
}

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(22, 33, 62, 0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 16px 24px;
}
.header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: #f8fafc;
  margin-bottom: 8px;
  text-align: center;
}
.stats-bar {
  display: flex;
  gap: 24px;
  font-size: 0.85rem;
  color: #94a3b8;
  margin-bottom: 12px;
  justify-content: center;
}
.stats-bar span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stats-bar .stat-value {
  color: #e2e8f0;
  font-weight: 600;
}

/* Tabs */
.tab-bar {
  display: flex;
  gap: 4px;
  justify-content: center;
  align-items: center;
}
.tab-btn {
  background: none;
  border: none;
  color: #94a3b8;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 8px 16px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab-btn:hover { color: #e2e8f0; }
.tab-btn.active {
  color: #60a5fa;
  border-bottom-color: #60a5fa;
}

/* Content */
.content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}
.tab-panel {
  display: none;
}
.tab-panel.active {
  display: block;
}

/* Rankings tab */
.chart-container {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
}
.chart-container canvas {
  max-height: 500px;
}
.rankings-table {
  width: 100%;
  border-collapse: collapse;
}
.rankings-table th {
  text-align: left;
  padding: 10px 12px;
  font-size: 0.8rem;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.rankings-table td {
  padding: 10px 12px;
  font-size: 0.9rem;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.rankings-table tr:hover {
  background: rgba(255,255,255,0.03);
}
.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.85rem;
}
.rank-change {
  font-weight: 600;
  font-size: 0.85rem;
}
.rank-up { color: #34d399; }
.rank-down { color: #f87171; }
.rank-new { color: #fbbf24; font-size: 0.75rem; }
.rank-same { color: #64748b; }
.color-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 8px;
}
.pct-bar {
  display: inline-block;
  height: 6px;
  border-radius: 3px;
  min-width: 4px;
}
.cluster-desc {
  font-size: 0.78rem;
  font-style: italic;
  color: #64748b;
  line-height: 1.4;
  margin-top: 2px;
}
.export-btn {
  margin-left: 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: #e2e8f0;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.export-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.25);
}
.export-btn:active {
  background: rgba(255,255,255,0.16);
}
.export-btn.exporting {
  opacity: 0.6;
  cursor: wait;
}
.chart-label-overlay {
  position: absolute;
  font: 500 16px Inter, sans-serif;
  transform: translateY(-50%);
  cursor: pointer;
  color: transparent;
  padding: 1px 2px;
  z-index: 10;
  white-space: nowrap;
}
.chart-label-overlay:hover {
  text-decoration: underline;
  text-decoration-color: var(--label-color);
}
.chart-popup {
  position: absolute;
  background: rgba(15, 23, 42, 0.97);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 14px 18px;
  max-width: 340px;
  z-index: 200;
  pointer-events: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.chart-popup .popup-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.chart-popup .popup-name {
  font-weight: 600;
  font-size: 0.95rem;
  color: #f8fafc;
}
.chart-popup .popup-stats {
  display: flex;
  gap: 14px;
  margin-bottom: 8px;
  font-size: 0.85rem;
}
.chart-popup .popup-stats span {
  color: #94a3b8;
}
.chart-popup .popup-stats .stat-val {
  color: #e2e8f0;
  font-weight: 600;
}
.chart-popup .popup-desc {
  font-size: 0.82rem;
  color: #94a3b8;
  line-height: 1.45;
  font-style: italic;
}
.chart-popup .popup-close {
  position: absolute;
  top: 8px;
  right: 10px;
  background: none;
  border: none;
  color: #64748b;
  font-size: 1.1rem;
  cursor: pointer;
  padding: 0 4px;
}
.chart-popup .popup-close:hover { color: #e2e8f0; }

/* Clusters tab */
.cluster-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: all 0.2s;
}
.cluster-card:hover {
  border-color: rgba(255,255,255,0.15);
}
.cluster-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
}
.cluster-header .expand-icon {
  margin-left: auto;
  color: #64748b;
  transition: transform 0.2s;
  font-size: 1.2rem;
}
.cluster-card.expanded .expand-icon {
  transform: rotate(180deg);
}
.cluster-name {
  font-weight: 600;
  font-size: 1rem;
  color: #f8fafc;
}
.cluster-rank-badge {
  background: rgba(255,255,255,0.1);
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 600;
  color: #94a3b8;
}
.cluster-stat {
  font-size: 0.85rem;
  color: #94a3b8;
}
.cluster-body {
  display: none;
  padding: 0 20px 20px;
}
.cluster-card.expanded .cluster-body {
  display: block;
}
.cluster-description {
  color: #94a3b8;
  font-size: 0.9rem;
  line-height: 1.5;
  margin-bottom: 16px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
}
.sparkline-container {
  height: 80px;
  margin-bottom: 16px;
}
.rank-trajectory {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 16px;
  font-size: 0.85rem;
  flex-wrap: wrap;
}
.rank-trajectory .rank-step {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.8rem;
  background: rgba(255,255,255,0.1);
  color: #e2e8f0;
}
.rank-trajectory .rank-arrow {
  color: #64748b;
  font-size: 0.8rem;
}
.rank-trajectory .rank-absent {
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  color: #475569;
  font-size: 0.7rem;
}
.example-framings {
  list-style: none;
  padding: 0;
}
.example-framings li {
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 0.88rem;
  line-height: 1.5;
  color: #cbd5e1;
}
.example-framings li:last-child { border-bottom: none; }
.example-framings li::before {
  content: "\2022";
  color: #64748b;
  margin-right: 8px;
}
.examples-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}

/* Unclustered tab */
.filter-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.filter-bar input {
  flex: 1;
  min-width: 200px;
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  color: #e2e8f0;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
}
.filter-bar input::placeholder { color: #64748b; }
.filter-bar input:focus {
  outline: none;
  border-color: #60a5fa;
}
.filter-bar select {
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  background: rgba(255,255,255,0.05);
  color: #e2e8f0;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
}
.filter-bar select:focus {
  outline: none;
  border-color: #60a5fa;
}
.filter-bar select option {
  background: #1e293b;
  color: #e2e8f0;
}
.unclustered-table {
  width: 100%;
  border-collapse: collapse;
}
.unclustered-table th {
  text-align: left;
  padding: 10px 12px;
  font-size: 0.8rem;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.unclustered-table th:hover { color: #e2e8f0; }
.unclustered-table th .sort-icon { margin-left: 4px; font-size: 0.7rem; }
.unclustered-table td {
  padding: 10px 12px;
  font-size: 0.88rem;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  vertical-align: top;
}
.unclustered-table td:nth-child(2),
.unclustered-table td:nth-child(5) {
  white-space: nowrap;
}
.unclustered-table tr:hover {
  background: rgba(255,255,255,0.03);
}
.unclustered-table tr.expanded-row {
  background: rgba(96, 165, 250, 0.05);
}
.framing-text {
  max-width: 500px;
  cursor: pointer;
}
.framing-text.truncated {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.confidence-bar {
  width: 60px;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
  margin-right: 6px;
}
.confidence-fill {
  height: 100%;
  border-radius: 3px;
}
.conf-low { background: #f87171; }
.conf-med { background: #fbbf24; }
.conf-high { background: #34d399; }

/* Evolution tab */
.evolution-group {
  margin-bottom: 32px;
}
.evolution-date {
  font-size: 1.1rem;
  font-weight: 600;
  color: #f8fafc;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.evo-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 12px;
}
.evo-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.evo-badge {
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.evo-badge.new { background: rgba(52,211,153,0.2); color: #34d399; }
.evo-badge.wording { background: rgba(96,165,250,0.2); color: #60a5fa; }
.evo-badge.merger { background: rgba(251,146,60,0.2); color: #fb923c; }
.evo-badge.adopted { background: rgba(167,139,250,0.2); color: #a78bfa; }
.evo-title {
  font-weight: 600;
  color: #f8fafc;
  font-size: 0.95rem;
}
.evo-rationale {
  color: #94a3b8;
  font-size: 0.88rem;
  line-height: 1.5;
  margin-bottom: 8px;
}
.evo-evidence {
  margin-top: 8px;
}
.evo-evidence-toggle {
  background: none;
  border: none;
  color: #60a5fa;
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  cursor: pointer;
  padding: 0;
}
.evo-evidence-toggle:hover { text-decoration: underline; }
.evo-evidence-list {
  display: none;
  list-style: none;
  padding: 8px 0 0;
}
.evo-evidence-list.visible { display: block; }
.evo-evidence-list li {
  padding: 4px 0;
  font-size: 0.85rem;
  color: #cbd5e1;
}
.evo-evidence-list li::before {
  content: "\2022";
  color: #64748b;
  margin-right: 8px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<div class="header">
  <h1>Framing Analysis Dashboard</h1>
  <div class="stats-bar">
    <span>Coverage: <span class="stat-value">2026-01-19 to 2026-02-15</span></span>
    <span>Runs: <span class="stat-value">4</span></span>
    <span>Reports: <span class="stat-value">330</span></span>
    <span>Framings: <span class="stat-value">1270</span></span>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="rankings">Rankings</button>
    <button class="tab-btn" data-tab="clusters">Clusters</button>
    <button class="tab-btn" data-tab="unclustered">Unclustered</button>
    <button class="tab-btn" data-tab="evolution">Evolution</button>
    <button class="export-btn" id="exportBtn" onclick="exportJpeg()">Export JPEG</button>
  </div>
</div>

<div class="content">

  <!-- Rankings Tab -->
  <div class="tab-panel active" id="tab-rankings">
    <div id="rankings-capture">
      <div class="chart-container" style="position:relative">
        <canvas id="bumpChart"></canvas>
      </div>
      <div class="chart-container">
        <table class="rankings-table" id="rankingsTable"></table>
      </div>
    </div>
  </div>

  <!-- Clusters Tab -->
  <div class="tab-panel" id="tab-clusters">
    <div id="clusterCards"></div>
  </div>

  <!-- Unclustered Tab -->
  <div class="tab-panel" id="tab-unclustered">
    <div class="filter-bar">
      <input type="text" id="framingSearch" placeholder="Search framings...">
      <select id="clusterFilter">
        <option value="">All clusters</option>
      </select>
    </div>
    <div class="chart-container" style="overflow-x:auto">
      <table class="unclustered-table" id="unclusteredTable">
        <thead>
          <tr>
            <th data-sort="text">Framing <span class="sort-icon"></span></th>
            <th data-sort="source_date">Date <span class="sort-icon"></span></th>
            <th data-sort="closest_cluster">Closest Cluster <span class="sort-icon"></span></th>
            <th data-sort="confidence">Confidence <span class="sort-icon"></span></th>
            <th data-sort="run_date">Run <span class="sort-icon"></span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Evolution Tab -->
  <div class="tab-panel" id="tab-evolution">
    <div id="evolutionTimeline"></div>
  </div>

</div>

// === UTILITY ===
function rankChangeHtml(change) {
  if (change === 'NEW' || change === 'new') return '<span class="rank-new">NEW</span>';
  if (change === 0) return '<span class="rank-same">\u2014</span>';
  if (change > 0) return '<span class="rank-up">\u25B2' + change + '</span>';
  return '<span class="rank-down">\u25BC' + Math.abs(change) + '</span>';
}

// === BUMP CHART ===
(function buildBumpChart() {
  const labels = runData.map(r => {
    const d = r.date_range;
    return d.start.slice(5) + ' \u2013 ' + d.end.slice(5);
  });

  // Collect all cluster IDs that appear in any run
  const allIds = new Set();
  runData.forEach(r => r.clusters.forEach(c => allIds.add(c.cluster_id)));

  // Find max rank across all runs for Y axis
  let maxRank = 0;
  runData.forEach(r => r.clusters.forEach(c => { if (c.rank > maxRank) maxRank = c.rank; }));

  const datasets = [];
  allIds.forEach(cid => {
    const meta = clusterMeta[cid] || { name: cid, color: '#94a3b8' };
    const data = runData.map(r => {
      const found = r.clusters.find(c => c.cluster_id === cid);
      return found ? found.rank : null;
    });
    datasets.push({
      label: meta.name,
      data: data,
      borderColor: meta.color,
      backgroundColor: meta.color,
      borderWidth: 2.5,
      pointRadius: 5,
      pointHoverRadius: 8,
      tension: 0.3,
      spanGaps: false,
      clusterId: cid,
    });
  });

  // Plugin: draw labels on canvas (for JPEG export)
  const directLabelPlugin = {
    id: 'directLabels',
    afterDatasetsDraw(chart) {
      const ctx2 = chart.ctx;
      ctx2.save();
      chart.data.datasets.forEach((ds, i) => {
        const meta = chart.getDatasetMeta(i);
        let lastIdx = -1;
        for (let j = meta.data.length - 1; j >= 0; j--) {
          if (ds.data[j] !== null) { lastIdx = j; break; }
        }
        if (lastIdx < 0) return;
        const pt = meta.data[lastIdx];
        ctx2.fillStyle = ds.borderColor;
        ctx2.font = '500 16px Inter, sans-serif';
        ctx2.textBaseline = 'middle';
        ctx2.fillText(ds.label, pt.x + 12, pt.y);
      });
      ctx2.restore();
    }
  };

  const ctx = document.getElementById('bumpChart').getContext('2d');
  const bumpChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    plugins: [directLabelPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2,
      layout: {
        padding: { right: 300, top: 10 }
      },
      scales: {
        y: {
          reverse: true,
          min: 0.5,
          max: maxRank + 1,
          ticks: {
            stepSize: 1,
            color: '#94a3b8',
            callback: v => Number.isInteger(v) ? '#' + v : ''
          },
          grid: { color: 'rgba(255,255,255,0.04)' }
        },
        x: {
          ticks: { color: '#94a3b8' },
          grid: { color: 'rgba(255,255,255,0.04)' }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const ri = ctx.dataIndex;
              const cid = ctx.dataset.clusterId;
              const run = runData[ri];
              const cluster = run.clusters.find(c => c.cluster_id === cid);
              if (!cluster) return ctx.dataset.label + ': not present';
              let s = ctx.dataset.label + ': #' + cluster.rank;
              s += ' (' + cluster.count + ' framings, ' + cluster.percentage + '%)';
              if (cluster.rank_change !== 'NEW' && cluster.rank_change !== 0) {
                s += cluster.rank_change > 0 ? ' \u25B2' + cluster.rank_change : ' \u25BC' + Math.abs(cluster.rank_change);
              } else if (cluster.rank_change === 'NEW') {
                s += ' (NEW)';
              }
              return s;
            }
          }
        }
      },
      onClick: function(evt, elements) {
        if (elements.length > 0) {
          const cid = datasets[elements[0].datasetIndex].clusterId;
          // Switch to clusters tab and scroll to card
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          document.querySelector('[data-tab="clusters"]').classList.add('active');
          document.getElementById('tab-clusters').classList.add('active');
          setTimeout(() => {
            const card = document.getElementById('cluster-' + cid);
            if (card) {
              card.classList.add('expanded');
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 100);
        }
      }
    }
  });
})();

// === CLICKABLE LABEL OVERLAYS ===
(function createLabelOverlays() {
  const canvas = document.getElementById('bumpChart');
  const container = canvas.closest('.chart-container');
  const chart = Chart.getChart(canvas);

  chart.data.datasets.forEach((ds, i) => {
    const meta = chart.getDatasetMeta(i);
    let lastIdx = -1;
    for (let j = meta.data.length - 1; j >= 0; j--) {
      if (ds.data[j] !== null) { lastIdx = j; break; }
    }
    if (lastIdx < 0) return;
    const pt = meta.data[lastIdx];

    const lbl = document.createElement('span');
    lbl.className = 'chart-label-overlay';
    lbl.textContent = ds.label;
    lbl.style.setProperty('--label-color', ds.borderColor);
    lbl.style.left = (canvas.offsetLeft + pt.x + 12) + 'px';
    lbl.style.top = (canvas.offsetTop + pt.y) + 'px';
    lbl.dataset.clusterId = ds.clusterId;
    lbl.dataset.color = ds.borderColor;
    lbl.addEventListener('click', function(e) {
      e.stopPropagation();
      showClusterPopup(ds.clusterId, ds.borderColor, e.clientX, e.clientY);
    });
    canvas.parentElement.appendChild(lbl);
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.chart-popup') && !e.target.closest('.chart-label-overlay')) {
      const existing = document.querySelector('.chart-popup');
      if (existing) existing.remove();
    }
  });
})();

function showClusterPopup(clusterId, color, clientX, clientY) {
  // Remove existing popup
  const old = document.querySelector('.chart-popup');
  if (old) old.remove();

  const meta = clusterMeta[clusterId] || {};
  const latest = runData[runData.length - 1];
  const cluster = latest.clusters.find(c => c.cluster_id === clusterId);

  const popup = document.createElement('div');
  popup.className = 'chart-popup';

  let changeHtml = '';
  if (cluster) {
    if (cluster.rank_change === 'NEW') changeHtml = '<span class="rank-new">NEW</span>';
    else if (cluster.rank_change === 0) changeHtml = '<span class="rank-same">\u2014</span>';
    else if (cluster.rank_change > 0) changeHtml = '<span class="rank-up">\u25B2' + cluster.rank_change + '</span>';
    else changeHtml = '<span class="rank-down">\u25BC' + Math.abs(cluster.rank_change) + '</span>';
  }

  popup.innerHTML = '<button class="popup-close" onclick="this.parentElement.remove()">\u2715</button>' +
    '<div class="popup-header"><span class="color-dot" style="background:' + color + '"></span>' +
    '<span class="popup-name">' + escapeHtml(meta.name || clusterId) + '</span></div>' +
    (cluster ? '<div class="popup-stats"><span>Share: <span class="stat-val">' + cluster.percentage + '%</span></span>' +
    '<span>Count: <span class="stat-val">' + cluster.count + '</span></span>' +
    '<span>Rank: <span class="stat-val">#' + cluster.rank + '</span></span>' +
    '<span>' + changeHtml + '</span></div>' : '') +
    (meta.description ? '<div class="popup-desc">' + escapeHtml(meta.description) + '</div>' : '');

  // Position relative to the chart container
  const chartContainer = document.getElementById('bumpChart').closest('.chart-container');
  chartContainer.appendChild(popup);
  const contRect = chartContainer.getBoundingClientRect();
  let left = clientX - contRect.left + 10;
  let top = clientY - contRect.top + 10;
  // Keep popup within container bounds
  if (left + 350 > contRect.width) left = contRect.width - 360;
  if (left < 0) left = 10;
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

// === RANKINGS TABLE ===
(function buildRankingsTable() {
  const latest = runData[runData.length - 1];
  const table = document.getElementById('rankingsTable');
  let html = '<thead><tr><th>Rank</th><th>Cluster</th><th>Count</th><th>Share</th><th>Change</th></tr></thead><tbody>';
  latest.clusters.sort((a, b) => a.rank - b.rank).forEach(c => {
    const meta = clusterMeta[c.cluster_id] || { color: '#94a3b8', description: '' };
    const maxPct = Math.max(...latest.clusters.map(x => x.percentage));
    const barWidth = Math.round((c.percentage / maxPct) * 100);
    html += '<tr>';
    html += '<td><span class="rank-badge" style="background:' + meta.color + '22;color:' + meta.color + '">' + c.rank + '</span></td>';
    html += '<td><span class="color-dot" style="background:' + meta.color + '"></span>' + c.cluster_name;
    if (meta.description) html += '<div class="cluster-desc">' + escapeHtml(meta.description) + '</div>';
    html += '</td>';
    html += '<td>' + c.count + '</td>';
    html += '<td><span class="pct-bar" style="width:' + barWidth + 'px;background:' + meta.color + '"></span> ' + c.percentage + '%</td>';
    html += '<td>' + rankChangeHtml(c.rank_change) + '</td>';
    html += '</tr>';
  });
  html += '</tbody>';
  table.innerHTML = html;
})();

  // Clone rankings content
  const rankingsClone = document.getElementById('rankings-capture').cloneNode(true);
  rankingsClone.style.cssText = 'max-width:1200px;margin:0 auto;padding:24px';
  // Remove overlay labels from clone (canvas has them drawn already)
  rankingsClone.querySelectorAll('.chart-label-overlay').forEach(el => el.remove());
  // cloneNode doesn't copy canvas pixel data — replace cloned canvas with an image
  const origCanvas = document.getElementById('bumpChart');
  const clonedCanvas = rankingsClone.querySelector('canvas');
  if (origCanvas && clonedCanvas) {
    const img = new Image();
    img.src = origCanvas.toDataURL();
    img.style.cssText = 'width:' + origCanvas.offsetWidth + 'px;height:' + origCanvas.offsetHeight + 'px;max-height:500px';
    clonedCanvas.replaceWith(img);
  }
  wrapper.appendChild(rankingsClone);

  html2canvas(wrapper, {
    backgroundColor: '#1a1a2e',
    scale: 2,
    useCORS: true,
    logging: false,
  }).then(canvas => {
    wrapper.remove();
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const latest = runData[runData.length - 1];
      a.download = 'framing-rankings-' + latest.date_range.end + '.jpg';
      a.click();
      URL.revokeObjectURL(url);
      btn.classList.remove('exporting');
      btn.textContent = 'Export JPEG';
    }, 'image/jpeg', 0.95);
  }).catch(err => {
    console.error('Export failed:', err);
    wrapper.remove();
    btn.classList.remove('exporting');
    btn.textContent = 'Export JPEG';
  });
}

// === CLUSTER CARDS ===
(function buildClusterCards() {
  const container = document.getElementById('clusterCards');
  const latest = runData[runData.length - 1];
  const sorted = [...latest.clusters].sort((a, b) => a.rank - b.rank);

  sorted.forEach((c, idx) => {
    const meta = clusterMeta[c.cluster_id] || { name: c.cluster_name, description: '', color: '#94a3b8' };

    // Build rank trajectory
    let trajectory = '';
    runData.forEach((r, ri) => {
      const found = r.clusters.find(x => x.cluster_id === c.cluster_id);
      if (ri > 0) trajectory += '<span class="rank-arrow">\u2192</span>';
      if (found) {
        trajectory += '<span class="rank-step" style="background:' + meta.color + '22;color:' + meta.color + '">#' + found.rank + '</span>';
      } else {
        trajectory += '<span class="rank-absent">\u2014</span>';
      }
    });

    // Example framings
    let examples = '';
    c.example_framings.forEach(f => {
      examples += '<li>' + escapeHtml(f) + '</li>';
    });

    const expanded = idx < 3 ? ' expanded' : '';
    const card = document.createElement('div');
    card.className = 'cluster-card' + expanded;
    card.id = 'cluster-' + c.cluster_id;
    card.innerHTML = `
      <div class="cluster-header" onclick="this.parentElement.classList.toggle('expanded')">
        <span class="color-dot" style="background:${meta.color}"></span>
        <span class="cluster-name">${c.cluster_name}</span>
        <span class="cluster-rank-badge">#${c.rank}</span>
        <span class="cluster-stat">${c.count} framings (${c.percentage}%)</span>
        <span class="expand-icon">\u25BC</span>
      </div>
      <div class="cluster-body">
        ${meta.description ? '<div class="cluster-description">' + escapeHtml(meta.description) + '</div>' : ''}
        <div class="sparkline-container"><canvas id="spark-${c.cluster_id}"></canvas></div>
        <div class="rank-trajectory">${trajectory}</div>
        <div class="examples-label">Example framings (latest run)</div>
        <ul class="example-framings">${examples}</ul>
      </div>
    `;
    container.appendChild(card);

    // Draw sparkline after card is in DOM
    setTimeout(() => buildSparkline(c.cluster_id, meta.color), 0);
  });
})();

function buildSparkline(clusterId, color) {
  const canvas = document.getElementById('spark-' + clusterId);
  if (!canvas) return;
  const labels = runData.map(r => r.date_range.end.slice(5));
  const data = runData.map(r => {
    const found = r.clusters.find(c => c.cluster_id === clusterId);
    return found ? found.count : 0;
  });
  new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor: color,
        backgroundColor: color + '20',
        borderWidth: 2,
        pointRadius: 3,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ctx.parsed.y + ' framings' }
      } },
      scales: {
        y: { display: false, beginAtZero: true },
        x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { display: false } }
      }
    }
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// === UNCLUSTERED TABLE ===
let sortCol = 'source_date';
let sortAsc = false;
let filteredFramings = [...allFramings];

function renderUnclusteredTable() {
  const tbody = document.querySelector('#unclusteredTable tbody');
  let html = '';
  filteredFramings.forEach((f, i) => {
    const meta = clusterMeta[f.closest_cluster] || { name: f.closest_cluster, color: '#94a3b8' };
    const confClass = f.confidence < 0.3 ? 'conf-low' : f.confidence < 0.4 ? 'conf-med' : 'conf-high';
    const confWidth = Math.round(f.confidence * 100);
    html += '<tr data-idx="' + i + '">';
    html += '<td class="framing-text truncated" onclick="toggleFraming(this)">' + escapeHtml(f.text) + '</td>';
    html += '<td>' + f.source_date + '</td>';
    html += '<td><span class="color-dot" style="background:' + meta.color + '"></span>' + meta.name + '</td>';
    html += '<td><span class="confidence-bar"><span class="confidence-fill ' + confClass + '" style="width:' + confWidth + '%"></span></span>' + f.confidence.toFixed(2) + '</td>';
    html += '<td>' + f.run_date + '</td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function toggleFraming(el) {
  el.classList.toggle('truncated');
  el.closest('tr').classList.toggle('expanded-row');
}

function sortFramings(col) {
  if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
  filteredFramings.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
  renderUnclusteredTable();
  // Update sort icons
  document.querySelectorAll('#unclusteredTable th').forEach(th => {
    const icon = th.querySelector('.sort-icon');
    if (th.dataset.sort === col) {
      icon.textContent = sortAsc ? '\u25B2' : '\u25BC';
    } else {
      icon.textContent = '';
    }
  });
}

// Sort click handlers
document.querySelectorAll('#unclusteredTable th[data-sort]').forEach(th => {
  th.addEventListener('click', () => sortFramings(th.dataset.sort));
});

// Filter handlers
function applyFilters() {
  const search = document.getElementById('framingSearch').value.toLowerCase();
  const cluster = document.getElementById('clusterFilter').value;
  filteredFramings = allFramings.filter(f => {
    if (search && !f.text.toLowerCase().includes(search)) return false;
    if (cluster && f.closest_cluster !== cluster) return false;
    return true;
  });
  // Re-apply current sort
  sortFramings(sortCol);
}

document.getElementById('framingSearch').addEventListener('input', applyFilters);
document.getElementById('clusterFilter').addEventListener('change', applyFilters);

// Populate cluster filter dropdown
(function() {
  const select = document.getElementById('clusterFilter');
  const clusterIds = [...new Set(allFramings.map(f => f.closest_cluster))].sort();
  clusterIds.forEach(cid => {
    const meta = clusterMeta[cid] || { name: cid };
    const opt = document.createElement('option');
    opt.value = cid;
    opt.textContent = meta.name;
    select.appendChild(opt);
  });
})();

// Initial render
sortFramings('source_date');

// === EVOLUTION TIMELINE ===
(function buildEvolutionTimeline() {
  const container = document.getElementById('evolutionTimeline');
  // Group by run_date, most recent first
  const grouped = {};
  evolutionTimeline.forEach(e => {
    if (!grouped[e.run_date]) grouped[e.run_date] = [];
    grouped[e.run_date].push(e);
  });
  const dates = Object.keys(grouped).sort().reverse();

  dates.forEach(date => {
    const group = document.createElement('div');
    group.className = 'evolution-group';

    const runInfo = runData.find(r => r.run_date === date);
    const dateLabel = runInfo ? date + ' (covering ' + runInfo.date_range.start + ' to ' + runInfo.date_range.end + ')' : date;
    group.innerHTML = '<div class="evolution-date">' + dateLabel + '</div>';

    grouped[date].forEach((e, idx) => {
      const card = document.createElement('div');
      card.className = 'evo-card';

      let badgeClass = 'new';
      let badgeText = 'NEW';
      let title = '';

      if (e.type === 'new_cluster') {
        badgeClass = 'new'; badgeText = 'NEW';
        title = 'Suggested: ' + (e.suggested_name || e.suggested_id);
      } else if (e.type === 'wording_revision') {
        badgeClass = 'wording'; badgeText = 'WORDING';
        title = (e.current_wording || '') + ' \u2192 ' + (e.suggested_wording || '');
      } else if (e.type === 'merger') {
        badgeClass = 'merger'; badgeText = 'MERGER';
        const names = (e.cluster_ids || []).map(cid => {
          const m = clusterMeta[cid];
          return m ? m.name : cid;
        });
        title = names.join(' + ');
      } else if (e.type === 'new_cluster_adopted') {
        badgeClass = 'adopted'; badgeText = 'ADOPTED';
        title = (e.adopted_name || e.adopted_id) + ' (' + (e.count || 0) + ' framings)';
      }

      let evidenceHtml = '';
      const framings = e.evidence_framings || [];
      if (framings.length > 0) {
        const evidenceId = 'evo-ev-' + date.replace(/-/g, '') + '-' + idx;
        evidenceHtml = '<div class="evo-evidence">' +
          '<button class="evo-evidence-toggle" onclick="document.getElementById(\'' + evidenceId + '\').classList.toggle(\'' + 'visible' + '\')">Show evidence (' + framings.length + ')</button>' +
          '<ul class="evo-evidence-list" id="' + evidenceId + '">' +
          framings.map(f => '<li>' + escapeHtml(f) + '</li>').join('') +
          '</ul></div>';
      }

      card.innerHTML = `
        <div class="evo-card-header">
          <span class="evo-badge ${badgeClass}">${badgeText}</span>
          <span class="evo-title">${escapeHtml(title)}</span>
        </div>
        <div class="evo-rationale">${escapeHtml(e.rationale || '')}</div>
        ${evidenceHtml}
      `;
      group.appendChild(card);
    });

    container.appendChild(group);
  });
})();
</script>
